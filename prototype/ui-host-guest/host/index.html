<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Klartext — Prototype</title>
  </head>
  <body>
    <!--
      PROTOTYPE ONLY. Three navigation variants for the Document split view,
      switchable via ?nav=A|B|C and the floating bar at the bottom:
        A  Breadcrumbs — sidebar stays; breadcrumb path is the page title.
        B  Focus — sidebar collapses; "‹ Parent" back button, title path menu, prev/next.
        C  Columns — sidebar | Document list | split view; no back needed.
      Mobile (≤ 768px) always uses B-style push navigation + a bottom sheet.
    -->
    <div id="app"></div>
    <div id="insights" class="insights">
      <div class="sheet-head">
        <button class="sheet-grabber" data-action="sheet-cycle" aria-label="Expand or shrink insights"><span></span></button>
        <button class="close-btn sheet-close" data-action="sheet-close" aria-label="Close insights">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
        </button>
      </div>
      <iframe id="guest-frame" title="Klartext insights" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>
    <div id="overlay-root"></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div id="proto-bar"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
