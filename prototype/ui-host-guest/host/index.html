<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Klartext Host — Prototype</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="./styles.scss" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar" class="sidebar">
        <header class="sidebar-header">
          <h1>Klartext</h1>
          <span class="badge">Host</span>
        </header>
        <nav id="document-list" class="document-list"></nav>
        <footer class="sidebar-footer">
          <button id="simulate-run" class="btn btn-secondary">Simulate extraction run</button>
          <p class="hint">Click a document, then start a run to lock the sidebar.</p>
        </footer>
      </aside>
      <main id="stage" class="stage">
        <div id="welcome" class="welcome">
          <h2>Welcome</h2>
          <p>Select a Document from the sidebar to load the Guest.</p>
        </div>
        <iframe id="guest-frame" class="guest-frame hidden" sandbox="allow-scripts allow-same-origin"></iframe>
      </main>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
