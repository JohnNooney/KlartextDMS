<!doctype html>
<!--
  The README hero composite (issue #52): screenshots.spec.ts loads this page
  over file://, points the two <img>s at the raw shots under test-results/,
  and screenshots the body at 1600x1000 @2x with omitBackground — the baked
  mockup frames and shadows are all the README gets, since GitHub strips CSS.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1600px; height: 1000px; background: transparent; }
      body { position: relative; font-family: -apple-system, system-ui, sans-serif; }

      .desktop {
        position: absolute;
        left: 72px;
        top: 92px;
        width: 1180px;
        border-radius: 14px;
        overflow: hidden;
        background: #000;
        box-shadow:
          0 40px 90px rgba(0, 0, 0, 0.38),
          0 6px 20px rgba(0, 0, 0, 0.22);
      }

      /* Slim browser chrome: traffic dots + a URL pill. */
      .chrome {
        height: 46px;
        background: #26272b;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 18px;
      }
      .dot { width: 12px; height: 12px; border-radius: 50%; }
      .dot:nth-child(1) { background: #ff5f57; }
      .dot:nth-child(2) { background: #febc2e; }
      .dot:nth-child(3) { background: #28c840; }
      .url {
        flex: 1;
        max-width: 560px;
        margin: 0 auto;
        height: 28px;
        border-radius: 8px;
        background: #17181b;
        color: #8e8e93;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        letter-spacing: 0.2px;
      }

      .screen { display: block; width: 100%; }

      /* Thin dark bezel, no notch — upright, overlapping the desktop's
         bottom-right corner. */
      .phone {
        position: absolute;
        left: 1180px;
        top: 352px;
        width: 354px;
        padding: 12px;
        border-radius: 48px;
        background: #17181a;
        box-shadow:
          0 44px 90px rgba(0, 0, 0, 0.42),
          0 8px 24px rgba(0, 0, 0, 0.24);
      }
      .phone .screen { border-radius: 36px; }
    </style>
  </head>
  <body>
    <div class="desktop">
      <div class="chrome">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="url">klartext-host.web.app</span>
      </div>
      <img id="reader" class="screen" alt="" />
    </div>
    <div class="phone">
      <img id="mobile" class="screen" alt="" />
    </div>
  </body>
</html>
