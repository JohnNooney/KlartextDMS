<!-- Mounted once while signed in and kept mounted hidden for background
     Extraction Jobs (issues #16, #25); displays while a Document is open —
     right-hand lane on desktop, a bottom sheet on mobile (#29) with three
     snap detents — peek, half, full — resting at peek so the PDF stays
     primary (issue #50). The detent mechanics are the shared Sheet
     primitive (issue #152); its handle strip sits ahead of the iframe so
     at peek the iframe's top sliver is the Guest's jump bar — there is no
     Host-side header (issue #79). -->
<div
  class="guest-frame-host"
  appSheet
  [detents]="detents"
  [(detent)]="sheetState"
  [hidden]="docOpen() === null"
  [class.lane-hidden]="laneHidden()"
>
  <button appSheetHandle [label]="sheetLabel()"></button>
  <iframe
    #frame
    class="guest-frame"
    [src]="guestUrl"
    title="Klartext insights panel"
    sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-forms allow-downloads"
  ></iframe>
</div>
