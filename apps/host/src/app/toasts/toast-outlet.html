<div class="toasts" aria-live="polite">
  @for (toast of toasts.toasts(); track toast.id) {
    <div class="toast show" role="status">
      <span class="toast-icon {{ toast.tone }}">
        @if (toast.tone === 'success') {
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.2 11 14.7l4.5-5"/></svg>
        } @else {
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5h7l4.5 4.5v11a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 5 19V5a1.5 1.5 0 0 1 1.5-1.5zM13.5 3.5V8H18"/></svg>
        }
      </span>
      <div class="toast-text">
        <strong>{{ toast.title }}</strong>
        @if (toast.body) {
          <span>{{ toast.body }}</span>
        }
      </div>
      <button type="button" class="toast-close" (click)="toasts.dismiss(toast.id)" [attr.aria-label]="'Dismiss ' + toast.title">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      </button>
    </div>
  }
</div>
