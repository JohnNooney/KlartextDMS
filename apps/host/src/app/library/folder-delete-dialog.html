<div
  class="dialog"
  appModalSurface
  #surface="appModalSurface"
  role="alertdialog"
  aria-modal="true"
  aria-labelledby="folder-delete-title"
  aria-describedby="folder-delete-body"
  (closeRequested)="closed.emit()"
>
  <header class="dialog-head">
    <h2 id="folder-delete-title">Delete folder</h2>
    <button type="button" class="close-btn" (click)="surface.requestClose()" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
    </button>
  </header>

  <p class="dialog-body" id="folder-delete-body">
    Delete {{ name() }}? <span data-testid="folder-delete-contents">{{ contents() }}</span>
  </p>

  <footer class="dialog-foot">
    <button type="button" class="btn btn-secondary" (click)="surface.requestClose()">Cancel</button>
    <button type="button" class="btn btn-danger" (click)="confirmed.emit()">Delete</button>
  </footer>
</div>
