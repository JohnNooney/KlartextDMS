<button type="button" class="backdrop" (click)="closed.emit()" aria-label="Close"></button>
<form class="dialog" role="dialog" aria-modal="true" aria-labelledby="folder-name-title" (submit)="submit($event)">
  <header class="dialog-head">
    <h2 id="folder-name-title">{{ heading() }}</h2>
    <button type="button" class="close-btn" (click)="closed.emit()" aria-label="Close">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
    </button>
  </header>

  <label class="field">
    <span>Name</span>
    <input
      type="text"
      name="name"
      [value]="name()"
      (input)="onName($event)"
      autocomplete="off"
      autofocus
      data-testid="folder-name-input"
    />
    @if (duplicate()) {
      <span class="field-error" role="alert" data-testid="folder-name-error">A folder with this name already exists here</span>
    }
  </label>

  @if (withDetails()) {
    <label class="field">
      <span>Description (optional)</span>
      <textarea name="description" rows="2" (input)="onDescription($event)" data-testid="folder-description"></textarea>
    </label>
    <label class="field">
      <span>Keywords (optional, comma-separated)</span>
      <input type="text" name="keywords" autocomplete="off" (input)="onKeywords($event)" data-testid="folder-keywords" />
    </label>
  }

  <footer class="dialog-foot">
    <button type="button" class="btn btn-secondary" (click)="closed.emit()">Cancel</button>
    <button type="submit" class="btn btn-primary" [disabled]="!canSave()">Save</button>
  </footer>
</form>
