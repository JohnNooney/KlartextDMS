<ul class="picker" role="listbox" aria-label="Destination folder" data-testid="folder-picker">
  @for (row of rows(); track row.id) {
    <li>
      <button
        type="button"
        class="picker-row"
        role="option"
        [class.is-selected]="row.id === value()"
        [attr.aria-selected]="row.id === value()"
        [disabled]="row.disabled"
        [style.padding-left.px]="8 + row.depth * 16"
        (click)="valueChange.emit(row.id)"
      >
        <svg width="16" height="14" viewBox="0 0 52 42" aria-hidden="true"><path d="M2 6a4 4 0 0 1 4-4h11.3a4 4 0 0 1 3 1.4L23 6.5h23a4 4 0 0 1 4 4V36a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z" fill="#5ac8fa"/></svg>
        <span lang="de">{{ row.name }}</span>
      </button>
    </li>
  }
</ul>
