<form
  class="dialog"
  appModalSurface
  #surface="appModalSurface"
  role="dialog"
  aria-modal="true"
  aria-labelledby="rename-title"
  (closeRequested)="onCloseRequested()"
  (submit)="submit($event)"
>
  <header class="dialog-head">
    <h2 id="rename-title">Rename</h2>
    <button type="button" class="close-btn" (click)="surface.requestClose()" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
    </button>
  </header>

  <label class="field">
    <span>Name</span>
    <input
      type="text"
      name="title"
      [value]="value()"
      (input)="onInput($event)"
      autocomplete="off"
      autofocus
      data-testid="rename-input"
    />
  </label>

  <footer class="dialog-foot">
    <button type="button" class="btn btn-secondary" (click)="closed.emit()">Cancel</button>
    <button type="submit" class="btn btn-primary" [disabled]="!canSave()">Save</button>
  </footer>
</form>

@if (confirmingDiscard()) {
  <app-discard-changes-alert
    (kept)="confirmingDiscard.set(false)"
    (discarded)="closed.emit()"
  />
}
