<div
  class="dialog"
  appModalSurface
  #surface="appModalSurface"
  role="dialog"
  aria-modal="true"
  aria-labelledby="upload-title"
  (closeRequested)="onCloseRequested()"
>
  <header class="dialog-head">
    <h2 id="upload-title">Upload documents</h2>
    <button type="button" class="close-btn" (click)="surface.requestClose()" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
    </button>
  </header>

  <div class="field">
    <span>Save to</span>
    <app-folder-picker [tree]="tree()" [value]="folderId()" (valueChange)="choose($event)" />
  </div>

  <div
    class="drop-zone"
    [class.is-over]="dropHover()"
    (dragover)="onDragOver($event)"
    (dragleave)="dropHover.set(false)"
    (drop)="onDrop($event)"
  >
    <span class="drop-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15.5V4.5M7.5 9 12 4.5 16.5 9M4.5 14.5v3A2.5 2.5 0 0 0 7 20h10a2.5 2.5 0 0 0 2.5-2.5v-3"/></svg>
    </span>
    <p class="drop-title">Drag PDFs here</p>
    <p class="drop-hint">PDF only · up to 10 MB each</p>
    <button type="button" class="btn btn-primary" (click)="fileInput.click()">Choose files…</button>
    <input
      #fileInput
      type="file"
      accept="application/pdf"
      multiple
      hidden
      (change)="onFiles(fileInput.files)"
    />
  </div>
</div>

@if (confirmingDiscard()) {
  <app-discard-changes-alert
    (kept)="confirmingDiscard.set(false)"
    (discarded)="closed.emit()"
  />
}
