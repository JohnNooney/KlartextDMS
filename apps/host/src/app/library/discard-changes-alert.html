<div
  class="dialog dialog-alert"
  appModalSurface
  #surface="appModalSurface"
  role="alertdialog"
  aria-modal="true"
  aria-labelledby="discard-title"
  aria-describedby="discard-body"
  (closeRequested)="kept.emit()"
>
  <header class="dialog-head">
    <h2 id="discard-title">Discard changes?</h2>
    <button type="button" class="close-btn" (click)="surface.requestClose()" aria-label="Keep editing">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
    </button>
  </header>

  <p class="dialog-body" id="discard-body">You have unsaved changes. They'll be lost if you close.</p>

  <footer class="dialog-foot">
    <button type="button" class="btn btn-secondary" autofocus (click)="kept.emit()">Keep Editing</button>
    <button type="button" class="btn btn-danger" (click)="discarded.emit()">Discard</button>
  </footer>
</div>
