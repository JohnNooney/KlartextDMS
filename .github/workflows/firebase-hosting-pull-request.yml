# Per-PR preview channels for both Hosting sites (issue #23, ADR 0004). The
# Guest channel deploys first so its hashed URL can be written into the Host's
# assets/config.json before the Host is built and deployed.
name: Deploy preview channels on PR

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gates:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  preview:
    name: preview deploy (Guest first)
    needs: gates
    # Preview deploys need the service-account secret — same-repo PRs only.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      # App Check debug tokens (#21), injected at the preview build once the
      # App Check SDK lands (#25/#26). Never set on production builds.
      KLARTEXT_HOST_DEBUG_TOKEN: ${{ secrets.KLARTEXT_HOST_DEBUG_TOKEN }}
      KLARTEXT_GUEST_DEBUG_TOKEN: ${{ secrets.KLARTEXT_GUEST_DEBUG_TOKEN }}
      # Previews serve seeded fixture Extractions (#30): deterministic review
      # UX, and no public Gemini path — the baked debug token would otherwise
      # let anyone who loads a preview burn the project's AI quota.
      VITE_FAKE_AI_PROVIDER: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build the Guest
        run: pnpm --filter @klartext/guest build
      - name: Deploy the Guest preview channel
        id: guest-channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KLARTEXT_B836C }}
          projectId: klartext-b836c
          channelId: pr-${{ github.event.pull_request.number }}
          target: guest
          firebaseToolsVersion: '15.31.0'

      # guestOrigin feeds both the iframe src and the Bus's origin allow-list —
      # reduce the deployed URL to its bare origin before writing config.json.
      # Preview channels run the App Check debug provider (issue #21): the
      # registered debug token rides along in config.json — never in production.
      - name: Point the Host at the Guest preview channel
        env:
          GUEST_CHANNEL_URL: ${{ steps.guest-channel.outputs.details_url }}
        run: >
          node -e "console.log(JSON.stringify({ guestOrigin: new URL(process.env.GUEST_CHANNEL_URL).origin, useEmulators: false, appCheckDebugToken: process.env.KLARTEXT_HOST_DEBUG_TOKEN }, null, 2))"
          > apps/host/public/assets/config.json
      - name: Build the Host
        run: pnpm --filter @klartext/host build
      - name: Deploy the Host preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KLARTEXT_B836C }}
          projectId: klartext-b836c
          channelId: pr-${{ github.event.pull_request.number }}
          target: host
          firebaseToolsVersion: '15.31.0'
