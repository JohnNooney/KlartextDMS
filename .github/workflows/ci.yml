# Reusable gate jobs shared by the PR and merge workflows (issue #23). All three
# jobs must pass before a preview deploy and before a live deploy. Suites
# accumulate in place: the bus-contract conformance suite joins `checks` (#24),
# emulator-backed repository tests and the @firebase/rules-unit-testing suite
# join `rules+integration` (#27), and the Playwright suite runs in `e2e` (#34).
name: CI gates

on:
  workflow_call:

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # No lint tooling in the workspace yet — `--if-present` no-ops until a
      # package defines a `lint` script. `typecheck` is the static gate.
      - run: pnpm -r --if-present lint
      - run: pnpm typecheck
      - run: pnpm test

  rules-integration:
    name: rules+integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Boots the emulators, seeds them, then runs each package's
      # `test:integration` script (none yet — the emulator smoke test is the
      # suite until repository tests and the rules suite land).
      - run: pnpm test:integration

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    env:
      # App Check debug tokens (#21), baked into the e2e builds by
      # scripts/build-e2e.mjs (Host config.json / Guest build-time env).
      KLARTEXT_HOST_DEBUG_TOKEN: ${{ secrets.KLARTEXT_HOST_DEBUG_TOKEN }}
      KLARTEXT_GUEST_DEBUG_TOKEN: ${{ secrets.KLARTEXT_GUEST_DEBUG_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm --filter @klartext/e2e exec playwright install --with-deps chromium
      # Playwright suite (#34): `pnpm build:e2e` builds the apps for the e2e
      # Environment — Guest with VITE_USE_FIREBASE_EMULATORS/VITE_FAKE_AI_PROVIDER
      # (#30: deterministic, offline, free), Host config.json → Guest :5055 —
      # then `firebase emulators:exec --only auth,firestore,storage,hosting`
      # seeds and runs `pnpm test:e2e` (chromium, Guest via frameLocator).
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
