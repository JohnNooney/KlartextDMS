# Live deploy on merge to main (issue #23): the gate jobs rerun, then both
# Hosting sites plus the committed Firestore and Storage rules go out together.
name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Serialise deploys; never cancel one mid-flight.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  gates:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: live deploy
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Production config: the committed config.production.json — production
      # Guest origin, no emulators, and no App Check debug tokens in this build.
      - run: cp apps/host/public/assets/config.production.json apps/host/public/assets/config.json
      - run: pnpm build

      - name: Write Firebase service-account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KLARTEXT_B836C }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
      - name: Deploy Hosting sites, Firestore and Storage rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: pnpm exec firebase deploy --only "hosting,firestore:rules,storage" --non-interactive
